name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - ".terraform.lock.hcl"
      - "scripts/terraform-plan.sh"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # SOURCE CODE
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # TERRAFORM
      # =====================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      # =====================================================
      # AWS AUTHENTICATION - OIDC
      # =====================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::490145258703:role/terraform-github-plan
          aws-region: eu-west-1
          role-session-name: terraform-plan-${{ github.run_id }}
          allowed-account-ids: 490145258703

      # =====================================================
      # VERIFY OIDC IDENTITY
      # =====================================================

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # =====================================================
      # TERRAFORM PLAN
      # =====================================================

      - name: Terraform Plan
        run: ./scripts/terraform-plan.sh