name: Terraform PR Pipeline

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - ".terraform.lock.hcl"
      - ".tflint.hcl"
      - "scripts/**"
      - ".github/workflows/terraform-pr.yml"

permissions:
  contents: read

concurrency:
  group: terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # 1. TERRAFORM QUALITY
  # ============================================================

  terraform-quality:
    name: Terraform Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: TFLint Init
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init

      - name: TFLint
        run: tflint --recursive

  # ============================================================
  # 2. SECURITY SCAN
  # ============================================================

  security-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform

  # ============================================================
  # 3. TERRAFORM PLAN
  # ============================================================

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    needs:
      - terraform-quality
      - security-scan

    # AWS credentials are never exposed to pull requests from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::490145258703:role/terraform-github-plan
          aws-region: eu-west-1
          role-session-name: terraform-plan-${{ github.run_id }}
          allowed-account-ids: 490145258703

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Plan
        run: ./scripts/terraform-plan.sh